apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-web-app
  namespace: harness-test
  labels:
    app: sample-web-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-web-app
  template:
    metadata:
      labels:
        app: sample-web-app
    spec:
      containers:
      - name: web
        image: <+artifact.image>
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: sample-web-app-svc
  namespace: harness-test
spec:
  type: NodePort
  selector:
    app: sample-web-app
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080

