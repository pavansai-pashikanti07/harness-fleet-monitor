name: CI - Build and Push Container

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Image version tag (e.g. v1.0.0, v2.0.0)'
        required: true
        default: 'v1.0.0'

env:
  # Replace with your Docker Hub username or keep as repository secret
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME || 'pavan' }}/harness-fleet-monitor

jobs:
  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        if: env.IMAGE_NAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Calculate Image Tags
        id: meta
        run: |
          VERSION="${{ github.event.inputs.version_tag || 'v1.0.0' }}"
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "sha_tag=$SHORT_SHA" >> $GITHUB_OUTPUT

      - name: 🐳 Build and Push Image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: ${{ secrets.DOCKERHUB_USERNAME != '' }}
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}

      - name: 📋 CI Summary
        run: |
          echo "### 🚀 CI Build Successful!" >> $GITHUB_STEP_SUMMARY
          echo "- **Image:** \`${{ env.IMAGE_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Version Tag:** \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Git SHA Tag:** \`${{ steps.meta.outputs.sha_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Target for Harness CD:** Ready for deployment via Harness Delegate!" >> $GITHUB_STEP_SUMMARY
