apiVersion: v1
kind: Service
metadata:
  name: {{ include "fleet-monitor.fullname" . }}-svc
  namespace: {{ .Values.namespace | default "harness-fleet" }}
  labels:
    {{- include "fleet-monitor.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort | default 8080 }}
    protocol: TCP
    name: http
    {{- if and (eq .Values.service.type "NodePort") .Values.service.nodePort }}
    nodePort: {{ .Values.service.nodePort }}
    {{- end }}
  selector:
    {{- include "fleet-monitor.selectorLabels" . | nindent 4 }}
