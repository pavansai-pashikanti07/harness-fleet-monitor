apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fleet-monitor.fullname" . }}
  namespace: {{ .Values.namespace | default "harness-fleet" }}
  labels:
    {{- include "fleet-monitor.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "fleet-monitor.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fleet-monitor.labels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: {{ .Chart.Name }}
        image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
        imagePullPolicy: {{ .Values.image.pullPolicy }}
        ports:
        - name: http
          containerPort: {{ .Values.service.targetPort | default 8080 }}
          protocol: TCP
        env:
        - name: APP_VERSION
          value: {{ .Values.appConfig.version | quote }}
        - name: APP_ENVIRONMENT
          value: {{ .Values.appConfig.environment | quote }}
        - name: APP_COLOR
          value: {{ .Values.appConfig.color | quote }}
        - name: DEPLOYED_BY
          value: {{ .Values.appConfig.deployedBy | quote }}
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: {{ .Values.probes.liveness.path | default "/healthz" }}
            port: http
          initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
        readinessProbe:
          httpGet:
            path: {{ .Values.probes.readiness.path | default "/healthz" }}
            port: http
          initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
          periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
